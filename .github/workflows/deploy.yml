name: Deploy to Cloud Run
# Trigger: manual only (workflow_dispatch) to prevent unintentional deployments
# from pushes to non-code files (*.md, .github/tools/, etc.)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy akilahapigateway \
            --image gcr.io/akilahstack/akilahapigateway \
            --service-account 858627689875-compute@developer.gserviceaccount.com \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated
