# Cloud Build configuration for akilahapigateway
# Wraps existing Dockerfile with proper logging config for regional builds

steps:
  # Build Docker image using existing Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/akilahapigateway:$SHORT_SHA'
      - '-f'
      - 'Dockerfile'
      - '.'
    id: 'build-image'

  # Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/akilahapigateway:$SHORT_SHA'
    id: 'push-image'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'akilahapigateway'
      - '--image=gcr.io/$PROJECT_ID/akilahapigateway:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
    id: 'deploy-cloud-run'

# Required for regional builds with service accounts
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Timeout
timeout: '1200s'

# Images to store
images:
  - 'gcr.io/$PROJECT_ID/akilahapigateway:$SHORT_SHA'
